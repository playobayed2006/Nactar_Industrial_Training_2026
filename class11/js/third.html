<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let op = 8000
        let dis_percentage = 0.10

        let discount_amount = op * dis_percentage
        console.log(discount_amount)
        document.write("discount amount is: ", discount_amount)

        let discounted_price = op - discount_amount
        console.log(discounted_price)
        document.write("<br>")
        document.write("discounted price is: ", discounted_price)
    
    </script>
</body>
