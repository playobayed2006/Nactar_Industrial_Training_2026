    <title>Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>First: flex, row</h1>
    <div class="container">
        <div class="row">
            <div class="col">1</div>
            <div class="col">2</div>
            <div class="col">3</div>
            <div class="col">4</div>
        </div>
    </div>

    <h1>Second: flex, column</h1>
    <div class="container2">
        <div class="row2">
            <div class="col2">1</div>
            <div class="col2">2</div>
            <div class="col2">3</div>
            <div class="col2">4</div>
        </div>
    </div>

    <h1>Third: flex-flow -- row, wrap</h1>
    <div class="container3">
        <div class="row3">
            <div class="col3">1</div>
            <div class="col3">2</div>
            <div class="col3">3</div>
            <div class="col3">4</div>
        </div>
    </div>

    <h1>Fourth: justify-content</h1>
    <div class="container4">

        <div class="row4">
            <div class="col4">1</div>
            <div class="col4">2</div>
            <div class="col4">3</div>
            <div class="col4">4</div>
        </div>
    </div>
